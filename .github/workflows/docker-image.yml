name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog-app:latest

  notify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up Kubernetes context
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure Kubeconfig
        run: |
              echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig.yaml
              export KUBECONFIG=kubeconfig.yaml

      - name: Port-forward Argo CD API
        run: |
              kubectl port-forward svc/argocd-server -n argocd 8081:443 &
              sleep 5

      - name: Trigger ArgoCD Sync via API
        run: |
              curl -X POST "https://localhost:8080/api/v1/applications/blog-app/sync" \
                   -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
                   -H "Content-Type: application/json" \
                   -d '{}'

      - name: Notify Build Success
        if: success()
        run: echo "The Docker image was successfully built and pushed!"

      - name: Notify Build Failure
        if: failure()
        run: echo "The Docker build or push failed!"